version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: deepseek-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  meilisearch:
    image: getmeili/meilisearch:v1.9
    container_name: deepseek-meilisearch
    environment:
      - MEILI_MASTER_KEY=masterKey123
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: deepseek-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
      - meilisearch
    volumes:
      - ./data:/app/data

volumes:
  qdrant_data:
  meili_data:
